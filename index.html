<!DOCTYPE html> 
<html lang="en">
<head>
    <meta charset="utf-8" /> 
    <meta http-equiv="X-UA-Compatible" content="IE=edge"> 
    <meta name="viewport" content="width=device-width, initial-scale=1">  
    <title>SmPL</title>
    <style>
        .header {
            background-color: rgb(255, 255, 255);
            padding: 15px;
            text-align: center;
            height: 150px;
        }

        .nav_menu {
            overflow: hidden;
            background-color: #333;
        }

        .nav_menu a {
            float: left;
            display: block;
            color: rgb(50, 168, 158);
            text-align: center;
            padding: 14px 16px;
            text-decoration: none;
        }

        .nav_menu a:hover {
            background-color: white;
            color: rgb(235, 154, 101);
        }

        body {
            font-family: Arial, sans-serif;
            background-color: rgb(182, 149, 149);
            margin: 0;
        }

        #container {
            display: flex;
            flex-wrap: wrap;
            margin: 10px;
            align-items: center;
            justify-content: center;
        }

        #video-container {
            flex: 1;
            width: 70%;
            max-width: 750px;
            position: relative;
            display: flex;
            margin-top: 20px;
            flex-direction: column;
            align-items: center;
        }

        #videoThumbnail {
            width: 100%;
            max-width: 560px;
            cursor: pointer;
        }

        #chatVideo {
            width: 100%;
            max-width: 560px;
            display: none;
        }

        #videoContainer {
            position: relative;
            width: 100%;
            max-width: 560px;
        }

        #justClickText {
            color: white;
            text-align: center;
            font-size: 24px;
            margin-top: 10px;
        }

        @media screen and (max-width: 768px) {
            #video-container {
                width: 90%;
            }
        }

        @media screen and (max-width: 400px) {
            #video-container {
                width: 100%;
            }
        }
    </style>
</head>  
<body>
    <!-- Header -->
    <div class="header" onclick="toggleAudio()" style="cursor: pointer;">
        <h2 style="color:rgb(0, 0, 0);font-size:400%; font-family: audela;">
            smpl.
        </h2>
    </div>

    <!-- Navigation-->
    <div class="nav_menu">
       <!-- <a href="about.html">-contact</a>-->
    </div> 

    <br><br><br>

    <!-- Video Container -->
    <div id="container"> 
        <div id="video-container">
            <div id="videoContainer">
                <img id="videoThumbnail" src="cool.jpg" alt="Video Thumbnail" onclick="playVideo()">
                <video id="chatVideo" controls onended="location.reload()" ondblclick="location.reload()">
                    <source src="shhhh.mp4" type="video/mp4">
                    Your browser does not support the video tag.
                </video>
                <div id="justClickText">Just Click The Pic</div>
            </div>
        </div>
    </div>
    <footer>
        <p>&copy; 2026 smpl inc. All rights reserved.</p>
    </footer>
    <!-- Background Audio -->
    <audio id="luckiomb" loop>
        <source src="luckiomb.mp3" type="audio/mp3">
        Your browser does not support the audio tag.
    </audio>

    <!-- Script -->
    <script>
        function playVideo() {
            var videoThumbnail = document.getElementById('videoThumbnail');
            var video = document.getElementById('chatVideo');
            var text = document.getElementById('justClickText');
            var audio = document.getElementById('luckiomb');

            // Stop background audio
            audio.pause();
            audio.currentTime = 0;

            // Hide thumbnail and prompt
            videoThumbnail.style.display = 'none';
            text.style.display = 'none';

            // Show and play video
            video.style.display = 'block';
            video.play();
        }

        function toggleAudio() {
            var audio = document.getElementById('luckiomb');
            if (audio.paused) {
                audio.play();
            } else {
                audio.pause();
            }
        }
    </script>
</body>
</html>
